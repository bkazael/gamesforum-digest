name: Gamesforum weekly digest

on:
  schedule:
    # Monday 06:00 Israel time (03:00 UTC summer / 04:00 UTC winter)
    - cron: "0 3 * * 1"
    # Two automatic retries, because the two failures in September were
    # both transient Gemini slowness rather than anything in this repo,
    # and both needed a human to notice and re-run. These make that
    # self-healing: main() exits immediately if the episode already
    # published, and checkpoint.py means a retry after a partial run only
    # synthesizes the chunks that are still missing -- so a retry costs
    # minutes and almost no quota. Spaced widely enough that a genuinely
    # slow API has time to recover between attempts.
    - cron: "0 6 * * 1"
    - cron: "0 10 * * 1"
  workflow_dispatch: {}   # Trigger manually from Actions tab

permissions:
  contents: write         # Needed to commit the new episode

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Was 20. The 2026-09-14 run got killed by this exact timeout at
    # 20m13s -- three TTS chunks legitimately took 3-7 minutes *each*
    # during a slow/flaky spell for Gemini (one chunk also hit a real
    # HTTP 500 mid-run), on top of ~3 extra minutes of 503 retries during
    # scoring. None of that was a bug; the API was just slow that day, and
    # 20 minutes had no real margin for it. The job was 21 seconds into
    # the final (smallest) TTS chunk when it was cancelled -- both
    # "Commit episode" and "Check source health" got skipped entirely, so
    # neither the episode nor even an alert about it went out that week.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Episode date
        id: ep
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Every run gets a clean runner, so checkpoint.py's .checkpoint/ dir
      # would vanish between attempts without this -- and the whole point
      # of it is to survive a failed attempt. restore-keys does prefix
      # matching, so today's second attempt picks up today's first attempt
      # (cache keys are immutable, hence run_id in the key and a prefix to
      # find it again). A new date simply finds nothing and starts fresh.
      - name: Restore episode checkpoint
        continue-on-error: true   # no checkpoint just means "start fresh"
        uses: actions/cache/restore@v4
        with:
          path: .checkpoint
          key: checkpoint-${{ steps.ep.outputs.date }}-${{ github.run_id }}
          restore-keys: checkpoint-${{ steps.ep.outputs.date }}-

      # A step-level timeout smaller than the job's own (35) matters
      # specifically because a JOB-level timeout cancels every remaining
      # step at once -- including "Commit episode" and "Check source
      # health" -- with no chance for either to run. This one failing (by
      # timeout or a real crash) instead leaves ~5 minutes of job budget
      # for "Report pipeline failure" below to still run and turn the job
      # red on purpose, which is what makes GitHub send its default
      # failure-notification email. See CHANGELOG, 2026-09-14: that gap is
      # exactly what left a real run silent with no episode and no alert.
      - name: Run pipeline
        id: run_pipeline
        timeout-minutes: 30
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
          DIGEST_LANG: he
          TTS_MODEL: gemini-2.5-flash-preview-tts
          # Only read by sources.py's from_email() adapter, and only if
          # profile.toml has a source with kind = "email" (Gamigion's is
          # still commented out -- see its comment there for why and what
          # activates it). Wired here ahead of that on purpose: adding the
          # two secrets in GitHub and flipping the profile.toml comment can
          # then happen as one independent step, with nothing else to touch.
          # Unset, these are just empty strings that from_email() never
          # gets called to read.
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python gamesforum_pipeline.py

      # `if: always()` is the whole trick: actions/cache's default
      # save-on-success would throw away the checkpoint in exactly the
      # case it exists for -- a run that died partway with finished work
      # worth keeping. A clean run deletes .checkpoint/ itself
      # (checkpoint.clear), so success caches an empty dir and the next
      # episode starts fresh regardless.
      # continue-on-error matters more than it looks: this step sits
      # between the pipeline and "Commit episode", which has no `if:` and
      # so runs only when everything before it succeeded. Without this, a
      # transient cache-service hiccup would skip publishing an episode
      # that was already fully built. A checkpoint is an optimization; it
      # must never stand between a finished episode and the feed.
      - name: Save episode checkpoint
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .checkpoint
          key: checkpoint-${{ steps.ep.outputs.date }}-${{ github.run_id }}

      - name: Commit episode
        id: commit_episode
        run: |
          git config user.name  "gamesforum-bot"
          git config user.email "bot@users.noreply.github.com"
          rm -rf __pycache__
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new this week"
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git push
          fi

      # Runs only after a successful publish (default `if:` behavior --
      # no explicit condition needed since a failed "Run pipeline" or
      # "Commit episode" already skips this the normal way). source_alerts.json
      # (written during the pipeline run above, from this run's data only
      # -- see source_health.py) is scratch space for this one job; it is
      # never committed and carries no history. The episode is already
      # published by the step before this one no matter what happens here.
      # This step failing turns the whole run red, which is what makes
      # GitHub send its own default failure-notification email -- one line
      # per source that came back empty this run, in plain language,
      # without ever blocking that week's episode on it.
      - name: Check source health
        run: |
          python3 -c "
          import source_health, sys
          alerts = source_health.pending_alerts()
          for line in alerts:
              print(f'::error::{line}')
          sys.exit(1 if alerts else 0)
          "

      # Runs ONLY when "Run pipeline" or "Commit episode" itself failed or
      # timed out -- i.e. no episode was published at all this week.
      # Checking those two steps' own outcome (not bare `if: failure()`,
      # which is true whenever ANY prior step failed) matters because
      # "Check source health" above is ALSO expected to fail sometimes on
      # a perfectly successful publish -- that's its whole job. A 2026-09-15
      # run hit exactly that: pipeline+commit both succeeded, "Check source
      # health" correctly failed over Gamigion's feed, and this step's old
      # bare `if: failure()` fired anyway and printed the wrong message
      # ("no episode was published") on a week that in fact published fine.
      - name: Report pipeline failure
        if: failure() && (steps.run_pipeline.outcome == 'failure' || steps.commit_episode.outcome == 'failure')
        run: |
          echo "::error::This week's digest pipeline failed or timed out -- no episode was published. Check the 'Run pipeline' step's log for where it stopped."
          exit 1
