name: Gamesforum weekly digest

on:
  schedule:
    # Monday 06:00 Israel time (03:00 UTC summer / 04:00 UTC winter)
    - cron: "0 3 * * 1"
  workflow_dispatch: {}   # Trigger manually from Actions tab

permissions:
  contents: write         # Needed to commit the new episode

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Was 20. The 2026-09-14 run got killed by this exact timeout at
    # 20m13s -- three TTS chunks legitimately took 3-7 minutes *each*
    # during a slow/flaky spell for Gemini (one chunk also hit a real
    # HTTP 500 mid-run), on top of ~3 extra minutes of 503 retries during
    # scoring. None of that was a bug; the API was just slow that day, and
    # 20 minutes had no real margin for it. The job was 21 seconds into
    # the final (smallest) TTS chunk when it was cancelled -- both
    # "Commit episode" and "Check source health" got skipped entirely, so
    # neither the episode nor even an alert about it went out that week.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
          DIGEST_LANG: he
          TTS_MODEL: gemini-2.5-flash-preview-tts
        run: python gamesforum_pipeline.py

      - name: Commit episode
        run: |
          git config user.name  "gamesforum-bot"
          git config user.email "bot@users.noreply.github.com"
          rm -rf __pycache__
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new this week"
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git push
          fi

      # Deliberately the LAST step. source_alerts.json (written during the
      # pipeline run above, from this run's data only -- see
      # source_health.py) is scratch space for this one job; it is never
      # committed and carries no history. The episode is already published
      # by the step before this one no matter what happens here. This step
      # failing turns the whole run red, which is what makes GitHub send
      # its own default failure-notification email -- one line per source
      # that came back empty this run, in plain language, without ever
      # blocking that week's episode on it.
      - name: Check source health
        run: |
          python3 -c "
          import source_health, sys
          alerts = source_health.pending_alerts()
          for line in alerts:
              print(f'::error::{line}')
          sys.exit(1 if alerts else 0)
          "
