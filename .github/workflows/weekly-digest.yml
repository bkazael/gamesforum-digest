name: Gamesforum weekly digest

on:
  schedule:
    # Monday 06:00 Israel time (03:00 UTC summer / 04:00 UTC winter).
    # GitHub cron is UTC only, so this runs 06:00 IDT / 05:00 IST.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write         # needed to commit the new episode

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub's default job timeout is six hours. Run #7 sat for an hour on a
    # single hung API call and would have kept going. Nothing here legitimately
    # takes more than about fifteen minutes, so this is the backstop that turns
    # a hang into a failed run you can see.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
          DIGEST_LANG: he
          TTS_MODEL: gemini-2.5-flash-preview-tts
        run: python gamesforum_pipeline.py

      - name: Commit episode
        run: |
          git config user.name  "gamesforum-bot"
          git config user.email "bot@users.noreply.github.com"
          # Named paths would fail on a week that produces no episode, since
          # git add errors on a pathspec that matches nothing.
          rm -rf __pycache__
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new this week"
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git push
          fi
