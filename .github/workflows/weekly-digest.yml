name: Gamesforum weekly digest

# The episode is built over several days (see stages.py): a short run every day from
# Friday to Wednesday does what is due that day and stops. 09:17 UTC is 01:17 Pacific,
# after the free-tier quota resets at 08:00 UTC; 15:17 UTC is a second try on the days
# that can publish. GitHub may start a scheduled run late or skip it: nothing here
# depends on a particular run happening, the next one picks the work up.
on:
  schedule:
    - cron: "17 9 * * 5,6,0,1,2,3"
    - cron: "17 15 * * 1,2,3"
  workflow_dispatch:
    inputs:
      force:
        description: "Run every stage now, ignoring the calendar (spends model quota)"
        type: boolean
        default: false

permissions:
  contents: write         # Needed to commit the work in progress and the episode

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55   # RUN_DEADLINE_SEC (45 min) < step (50) < job (55)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Episode week
        id: ep
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Only the synthesized speech lives in the cache (tens of MB, needed on the
      # publish day to survive a failed mix). The text work is committed under work/.
      - name: Restore speech cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .checkpoint
          key: checkpoint-v4-${{ steps.ep.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: checkpoint-v4-${{ steps.ep.outputs.week }}-

      # A failure turns this step red only on the last chance day (Wednesday); on the
      # other days it is a warning, because the next run retries. See stages.run().
      - name: Run pipeline
        id: run_pipeline
        timeout-minutes: 50
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
          SHOW_NAME: ${{ vars.SHOW_NAME }}
          DIGEST_LANG: he
          TTS_MODEL: ${{ vars.TTS_MODEL }}
          GEMINI_CREATIVE_MODEL: ${{ vars.GEMINI_CREATIVE_MODEL }}
          GEMINI_SCORING_MODEL: ${{ vars.GEMINI_SCORING_MODEL }}
          GEMINI_REVIEW_MODEL: ${{ vars.GEMINI_REVIEW_MODEL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PIPELINE_FORCE: ${{ inputs.force && '1' || '' }}
        run: python gamesforum_pipeline.py

      - name: Save speech cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .checkpoint
          key: checkpoint-v4-${{ steps.ep.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: pipeline-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            ledger/
            work/
            source_alerts.json
          retention-days: 14

      # Every run commits what it did, failed or not: the selection, the stories
      # written so far, the ledger and the reports. A failed run is then visible in
      # the repository, and the next run starts from it.
      - name: Commit the week's work
        if: always()
        run: |
          git config user.name  "gamesforum-bot"
          git config user.email "bot@users.noreply.github.com"
          for p in work episodes digests ledger reports feed.xml state.json memory.json seen.json; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "digest: $(date -u +%Y-%m-%d) $(date -u +%a)"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep $((attempt * 5))
            done
          fi

      # Source problems are a warning in the run summary, not a red run: the episode
      # may well have been built, and the weekly check below is the one that alerts.
      - name: Source health
        if: always()
        run: |
          python3 -c "
          import source_health
          for line in source_health.pending_alerts():
              print(f'::warning::{line}')
          "
