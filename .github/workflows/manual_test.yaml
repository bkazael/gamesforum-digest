name: Manual Test Episode Generation (Sandbox)

on:
  workflow_dispatch:

jobs:
  run-test-episode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai pydantic feedparser beautifulsoup4 requests jinja2 toml tomli

      - name: Run Test Pipeline via Main Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # הרצת המנוע המרכזי במוד בדיקה
          python gamesforum_pipeline.py

      - name: Upload Generated Test Audio
        uses: actions/upload-artifact@v4
        with:
          name: test-episode-audio
          path: ./episodes/*.mp3
          retention-days: 2
