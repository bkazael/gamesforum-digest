name: Manual Test Episode Generation (Sandbox)

on:
  workflow_dispatch:

jobs:
  run-test-episode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai pydantic feedparser beautifulsoup4 requests jinja2 toml tomli

      - name: Run Sandbox Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # הרצת קובץ ה-Sandbox המבודד
          python sandbox_pipeline.py

      - name: Upload Generated Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-episode-output
          path: ./output/*
          retention-days: 2
