name: Live smoke test (manual, small real cost)

# Tier 2. Deliberately workflow_dispatch-only -- never on push, PR, or a
# schedule. This is the one workflow in the repo that spends real
# GEMINI_API_KEY budget: one short script generation + one TTS call
# (live_smoke.py explains exactly why that's cheap). Trigger it by hand
# before trusting a model, schema, or prompt change in production; for
# everything else, test.yaml's zero-token suite runs on every push already.
#
# It replaces the old sandbox_pipeline.py / DiscoveryEngine-based sandbox
# workflow, which called a class that no longer exists in discovery.py and
# discovered zero articles on every run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smoke fixture or isolated full episode preview (never publishes)'
        type: choice
        options: [smoke, script, preview]
        default: smoke

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    # Was 5, when this was three calls. It is five now (score, prep, script,
    # intro, TTS), and a single slow Gemini call can legitimately take a few
    # minutes -- a smoke test that times out on a slow day just teaches
    # people to ignore it.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # No pip install: live_smoke.py and the modules it imports are
      # stdlib-only, same as the production pipeline.
      - name: Restore preview work
        if: inputs.mode != 'smoke'
        uses: actions/cache/restore@v4
        with:
          path: preview_output/.checkpoint
          key: preview-${{ github.ref_name }}-${{ hashFiles('*.py', 'profile.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: preview-${{ github.ref_name }}-${{ hashFiles('*.py', 'profile.toml') }}-

      - name: Run isolated validation
        timeout-minutes: 30
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CREATIVE_MODEL: ${{ vars.GEMINI_CREATIVE_MODEL }}
          VALIDATION_MODE: ${{ inputs.mode }}
        run: |
          case "$VALIDATION_MODE" in
            preview) python preview.py ;;
            script) python preview.py --script-only ;;
            *) python live_smoke.py ;;
          esac

      - name: Save preview work
        if: always() && inputs.mode != 'smoke'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: preview_output/.checkpoint
          key: preview-${{ github.ref_name }}-${{ hashFiles('*.py', 'profile.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ inputs.mode }}-${{ github.run_attempt }}
          path: |
            smoke_output/
            preview_output/
          include-hidden-files: true
          retention-days: 7
