name: CI Test Suite (zero-token, every push)

# Tier 0/1: pure logic + mocked wiring/contract checks. No network, no
# GEMINI_API_KEY, no cost, runs in seconds. This is deliberately separate
# from manual_test.yaml (Tier 2), which spends a small amount of real
# Gemini budget and only runs when someone triggers it on purpose -- see
# README.md for the full tier breakdown.
on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The production code is stdlib-only (urllib, tomllib, ...). The tests need only
      # pytest, which runs each test_*.py script as one test (check_suite.py).
      - name: Install pytest
        run: pip install -r requirements-dev.txt

      - name: Run zero-token tests
        env:
          GEMINI_API_KEY: test-key   # never used for a real call in this tier
        run: pytest -q
