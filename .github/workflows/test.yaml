name: CI Test Suite (Dry-Run Only)

# הריצה תתרחש רק כשיש Push או Pull Request ולא על פיד הפרודקשן
on:
  push:
    branches-ignore:
      - main  # לא מריץ בפרודקשן
  pull_request:
    branches:
      - main
  workflow_dispatch: # מאפשר הרצה ידנית לבדיקה בלבד

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tomli requests google-genai pydantic

      - name: Run Dry-Run Tests (Zero Tokens)
        run: |
          python test_pipeline.py
