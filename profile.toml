voice_a   = "Kore"       # קול נשי (תוקן)
speaker_b = "Yoni"
voice_b   = "Charon"     # קול גברי

direction = """
Two industry colleagues talking. Measured, unhurried, genuinely interested. Strategic and deep.
שני עמיתים ותיקים בתעשיית המשחקים, יושבים ומדברים על מה שקרה בתעשייה לאחרונה.
לא שידור, לא הרצאה, לא מכירה. שיחה בין אנשים שמכירים אחד את השני.
הטון: מיושב וענייני. מתעניינים בחומר כי הוא מעניין. קצב טבעי, לא ממהר. משפטים נגמרים בירידה, לא בעלייה.
מה לא לעשות: לא התלהבות של רדיו בוקר. לא הפתעה מוגזמת. לא חיוך בקול. אמצע החיים.
"""

[speech]
