# ---------------------------------------------------------------- הגדרות ריצה

[thresholds]
min_score = 6
max_articles = 6
min_words = 120
max_age_days = 7        # שבועי, קבוע. הניסיון החד-פעמי בסריקת חודש שלם (30 יום) הסתיים.

# תקרת ביטחון על שלב ה-fetch: כמות המועמדים המקסימלית שהמנוע יוריד וימדוד
# באמת בכל ריצה. לא רלוונטי היום (4 מקורות, בערך 100 מועמדים בשבוע), אבל
# מגן על זמן הריצה אם יתווספו עוד מקורות בעתיד -- כל fetch הוא בקשת רשת
# טורית עם ניסיונות חוזרים, וזה בדיוק השלב שיישבר ראשון מול ה-20 דקות
# timeout של GitHub Actions. אפשר להעלות בבטחה אם תוסיף מקורות ותראה
# "SKIPPED" מופיע ב-ledger.
max_candidates_to_fetch = 150
fetch_workers = 4
require_publication_date = true
min_scoring_coverage = 0.8
max_source_bonus = 0.5

# תקרות המקור (max_per_episode) הן "רכות", בשני צעדים תחומים. ב-28.9 היה
# מקום ל-8 כתבות ונבחרו 7, ובכל זאת נזרקו כתבות בציון 9 (Newzoo עם נתוני
# CPI והורדות, ChillBase, Jest) בגלל תקרות, בזמן ש-PR והודעת סיכום בציון 7
# נשארו. תקרה נועדה למנוע ממקור פורה להשתלט, לא להעדיף 7 על פני 9.
#   cap_overflow            כמה כתבות מעבר לתקרה מותר למקור אחד (0 = תקרה קשיחה)
#   cap_overflow_min_score  ציון מינימלי כדי לנצל מקום פנוי מעבר לתקרה
#   swap_margin             בכמה נקודות כתבה "חתוכה" צריכה לנצח את החלשה
#                           שנבחרה כדי להחליף אותה
#   max_swaps               מקסימום החלפות כאלה בפרק (אף פעם לא מוציאים את
#                           הנציג היחיד של מקור)
cap_overflow = 1
cap_overflow_min_score = 8.0
swap_margin = 2.0
max_swaps = 2

# ---------------------------------------------------------------- זיכרון

[memory]
# כמה פרקים אחרונים נכנסים כהקשר לתסריט של הפרק הבא (ראה memory.py).
# מספר גדול יותר = יותר רצף נרטיבי, אבל גם יותר טוקנים בכל קריאה לתסריט.
lookback_episodes = 3

# כמה פרקים אחורה נבדק ב-*דירוג* אם כתבה היא חזרה על משהו שכבר שודר. רחב
# מהחלון של התסריט בכוונה: תסריט צריך רק רצף של סיפורים שוטפים, אבל "כבר
# סיפרנו את זה למאזין?" צריך לכסות בערך חודש. ב-28.9 נתוני השוק של אוגוסט
# סוקרו שוב 13 יום אחרי 15.9, מכתבה אחרת ועם סכומים שונים (4.2 מיליארד
# הורדות ירידה של 7% מול 3.76 מיליארד עלייה של 1%).
scoring_lookback_episodes = 4

