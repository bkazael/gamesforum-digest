# מי אתה ומאיפה קוראים. זה הקובץ היחיד שתערוך.
# אחרי כל ריצה תקבל ledger שמראה מה נכנס, מה נזרק ולמה. תכוון לפי זה.

[identity]
who = """
בעלים של חברת משחקי מובייל, איש מקצוע ותיק. לא צריך הסברי יסוד ולא
הגדרות של UA, LTV, retention, churn, eCPM או ARPDAU.

הפורטפוליו שלו:
- Casual / Puzzle (match-3, מילים, חידות)
- Hybrid-casual (לולאה קלה עם עומק מטה, מודעות + IAP)
- משחקי כסף אמיתי מבוססי מיומנות (real-money skill-based)

הענף השלישי הוא הייחודי, והוא נושא חשיפות שלא קיימות בשני האחרים:
חוקיות skill מול chance לפי מדינה ולפי טריטוריה, רגולציית משחקי כסף,
תשלומים והפקדות ומשיכות, KYC, הונאה וקנוניה בין שחקנים, מדיניות
אפל וגוגל לגבי אפליקציות עם כסף אמיתי, ומתחרים ישירים במרחב הזה.

הוא עובד במקביל על כל החזיתות: UA שלא מסתמן, retention ו-LTV,
מונטיזציה ותמחור, וצמיחה ואסטרטגיה. אין לו בעיה אחת דומיננטית.

הוא רוצה רוחב. הוא מחפש עדכונים על עולם המשחקים באופן שוטף, לא רק
חומר שמשנה החלטה מיידית. לדעת על מה מדברים בתעשייה זה ערך בפני עצמו,
ומשם הוא יחליט במה להעמיק.
"""

# מה הוא רוצה לצאת איתו מפרק. משמש את שכבת החשיבה בדירוג.
wants = """
1. מה מתחרים עושים, במיוחד ב-casual, puzzle, hybrid-casual ו-RMG
2. טקטיקות שאפשר ליישם, ברמת פירוט שמאפשרת לנסות
3. מה קורה בשוק ועל מה מדברים בתעשייה, גם בלי מסקנה מיידית
4. מספרים ובנצ'מרקים להשוות אליהם
"""

# ---------------------------------------------------------------- מקורות
#
# weight          מכפיל על ציון הרלוונטיות. מקור חלש יותר לא נחסם, רק צריך
#                 להיות טוב יותר כדי להיכנס.
# max_per_episode תקרה קשיחה לכל מקור. זה הדבר שמונע ממקור בעל נפח גבוה
#                 להשתלט על הפרק רק כי הוא מפרסם הרבה. חשוב.
# block           דפוסי כותרת שנפסלים לפני הורדה, בנוסף לרשימה הגלובלית.

[[sources]]
name = "Gamesforum"
kind = "html"
urls = [
  "https://www.globalgamesforum.com/features",
  "https://www.globalgamesforum.com/news",
]
link_pattern = '/(?:features|news)/[a-z0-9][a-z0-9\-.]{8,}'
weight = 1.0
max_per_episode = 2

[[sources]]
name = "PocketGamer.biz"
kind = "rss"
urls = ["https://www.pocketgamer.biz/index.rss"]
weight = 1.0
max_per_episode = 3

# הסיכומים השבועיים שלהם. הם לא נכנסים לפרק כתוכן — אם נסכם סיכום
# נאבד את המספרים ונקבל דחיסה כפולה. במקום זה הם נקראים כדי לחלץ מהם
# את הלינקים, וכל כתבה שהעורכים שלהם בחרו להבליט מקבלת בוסט.
# זה השימוש הנכון בהם: אות עריכתי, לא חומר גלם.
roundup_patterns = ["hot five", "week in views", "week in mobile games"]
roundup_boost = 1.6

# פורמטים חוזרים שמייצרים ערך גבוה באופן עקבי.
boost = [
  "in the hot seat",       # ראיונות עומק עם מפעילים
  "charticle",             # ניתוח מבוסס נתונים
  "mobile mavens",         # פאנל אנליסטים
  "q[1-4] results", "revenue up", "revenue rises", "net bookings",
  "earnings", "benchmark",
]

block = [
  "pgc\\b", "pg connects", "pocket gamer connects", "speaker lineup",
  "who's coming", "summit shanghai",
  "jobs? news", "movers and shakers", "appoints", "steps? down",
  "joins .* as", "hiring", "game jam", "student ambassador",
  "in association with", "sponsored", "esports nations",
]

# אזהרה: pocketgamer.com הוא אתר צרכני, לא B2B. רוב התוכן שם ביקורות,
# מדריכים ורשימות "המשחקים הכי טובים", שלא רלוונטיים לך כמפעיל.
# השארתי אותו בפנים במשקל נמוך ועם חסימות אגרסיביות. אם ה-ledger מראה
# שהוא לא מייצר ערך אחרי כמה שבועות, פשוט תמחק את הבלוק הזה.
[[sources]]
name = "PocketGamer.com"
kind = "rss"
urls = ["https://www.pocketgamer.com/index.rss"]
weight = 0.55
max_per_episode = 1
block = [
  "review", "hands-on", "preview", "best .* games", "tier list",
  "guide", "how to", "codes", "cheats", "walkthrough", "tips and tricks",
  "everything we know", "release date", "beginner", "characters ranked",
  "update .* patch notes", "giveaway",
]

# ---------------------------------------------------------------- טעם

[interests]
core = [
  "מונטיזציה: IAP, מודעות, היברידי, תמחור, מבנה חנות, offerwall",
  "UA: CPI, ROAS, אטריביוציה, יצירתיבים, ערוצים, תקופות החזר, SKAN",
  "LTV, retention, churn, סגמנטציה של שחקנים",
  "LiveOps: אירועים, battle pass, עיצוב כלכלה, לוחות תוכן",
  "בנצ'מרקים ונתונים קשים על ביצועי ז'אנרים",
  "מהלכי שוק: רכישות, מדיניות חנויות, עמלות, רגולציה",
  "DTC, web shops, מכירה ישירה, עקיפת עמלות הפלטפורמה",

  # הענף שהיה חסר לגמרי
  "משחקי כסף אמיתי מבוססי מיומנות: רגולציה פדרלית ומדינתית, פסיקות skill מול chance, איסורים טריטוריאליים",
  "תשלומים במשחקי RMG: הפקדות, משיכות, KYC, ספקי תשלום, הונאה, קנוניה בין שחקנים, בוטים",
  "מדיניות אפל וגוגל לגבי אפליקציות עם כסף אמיתי ותחרויות בכסף",
  "מתחרים ישירים ב-RMG ובטורנירים מבוססי מיומנות",

  # התאמה לז'אנרים שלו
  "מהלכים של סטודיואים ב-casual, puzzle, match-3 ו-hybrid-casual",
  "כותרים ספציפיים שעלו או נפלו בז'אנרים האלה, ולמה",
]

# הוא לא סימן שום דבר כמיותר. לכן זו רשימה קצרה בכוונה: רק דברים
# שבאמת לא נוגעים אליו. בספק, נכניס. עדיף שיפסל בשמיעה מאשר שיפוספס.
deprioritize = [
  "חדשות קונסולות או PC בלבד, בלי שום זווית מובייל",
  "ביקורות משחקים ומדריכים שמכוונים לשחקנים ולא למפעילים",
]

# נחסם בכל המקורות.
[hard_block]
title_patterns = [
  "meet the speakers", "register now", "book your", "tickets",
  "save €", "save $", "early bird", "agenda", "join us",
  "why .* has become", "why .* is emerging",
  "last chance", "days remaining", "sponsor",
]

[thresholds]
min_score = 6          # ציון רלוונטיות מינימלי אחרי המשקל
max_articles = 5       # סה"כ כתבות בפרק
min_words = 250        # מתחת לזה זה קצרמר
max_age_days = 10      # מתעלם מארכיון, מונע הצפה בריצה ראשונה

# ---------------------------------------------------------------- זמן אוויר
#
# איך הציון מתורגם לזמן דיבור בפרק. הכתבה החזקה מקבלת סיפור, החלשה
# מקבלת משפט. בלי זה כל פריט מקבל אותו נפח וזה נשמע כמו רשימה.

# ---------------------------------------------------------------- קולות
#
# 30 קולות זמינים. שמע אותם ב-aistudio.google.com/generate-speech
#
# רגועים ומקצועיים (מומלץ כאן):
#   Charon מוסר מידע · Rasalgethi מוסר מידע · Sadaltager יודע דבר
#   Schedar אחיד · Umbriel נינוח · Zubenelgenubi יומיומי
#   Algieba חלק · Iapetus צלול · Vindemiatrix עדין · Achird ידידותי
#
# הימנע מאלה, הם מייצרים בדיוק את הטון הנלהב מדי:
#   Puck · Fenrir · Laomedeia · Sadachbia · Zephyr

[voice]
speaker_a = "Dana"
voice_a   = "Charon"      # נושאת את החומר. מוסרת מידע, לא מוכרת אותו
speaker_b = "Yoni"        # שואל ומנסח מחדש
voice_b   = "Umbriel"     # נינוח. לא נלהב, לא אדיש

# הוראות הבימוי שנשלחות ל-TTS. זה מה שקובע אם זה נשמע כמו שיחה
# או כמו הקראה. ערוך בחופשיות אם הטון לא יושב לך.
direction = """
שני עמיתים ותיקים בתעשיית המשחקים, יושבים ומדברים על מה שקרה השבוע.
לא שידור, לא הרצאה, לא מכירה. שיחה בין אנשים שמכירים אחד את השני.

הטון: מיושב וענייני. הם מתעניינים בחומר כי הוא באמת מעניין אותם,
לא כי הם צריכים להישמע מתעניינים. הביטחון של אנשים שלא צריכים
להוכיח כלום.

קצב: טבעי, לא ממהר. משפטים נגמרים בירידה, לא בעלייה.
נשימות במקומות הגיוניים. מותר שקט קצר לפני נקודה חשובה.

מה לא לעשות: לא התלהבות של רדיו בוקר. לא הפתעה מוגזמת. לא הדגשה
של כל מספר. לא חיוך בקול. וגם לא השטחה מונוטונית של מי שקורא
מדף. אמצע החיים.
"""

[airtime]
lead_share = 0.40      # הסיפור המוביל מקבל 40% מהפרק
second_share = 0.25
remainder_share = 0.35 # מתחלק בין השאר
